[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "GPL-3.0-only"
repository = "https://github.com/InfoDiveLabs/braid"
homepage = "https://www.infodivelabs.com"
description = "A download manager that splits one file across every network path you have."
authors = ["Suraj Tiwari <surajtiwari020@gmail.com>"]
keywords = ["download-manager", "bittorrent", "multipath", "resume"]
categories = ["command-line-utilities", "network-programming"]

[workspace.dependencies]
dl-core    = { path = "crates/dl-core" }
dl-net     = { path = "crates/dl-net" }
dl-testkit = { path = "crates/dl-testkit" }
dl-torrent = { path = "crates/dl-torrent" }

anyhow = "1"
# The one dependency this task adds. Storing a password directly, even hashed
# with something fast like SHA-256, is what turns a single leaked config
# directory into every instance owned at once: fast hashes are precisely what
# GPUs are good at brute-forcing. Argon2id is the RFC 9106 recommendation for
# this exact job, memory-hard so the same attack costs orders of magnitude
# more, and this crate is the RustCrypto reference implementation rather than
# a wrapper this project would otherwise have to trust blindly.
argon2 = "0.6"
# Pulled up from dl-testkit's own Cargo.toml, where it was pinned on its own.
# dl-server needs the same version to mount its health check, and a second
# independent pin is how two crates end up on two different axum minor
# versions with no one noticing until a trait bound stops matching.
axum = "0.8"
# Likewise pulled up from dl-net's own pin, for the same reason: dl-server's
# health response is JSON and gains nothing from a second, possibly
# diverging, version of serde living beside dl-net's.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1.53", default-features = false }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
opt-level     = "s"
lto           = "fat"
codegen-units = 1
panic         = "abort"
strip         = "symbols"
incremental   = false

# NOTE: re-add `[profile.release.package.{blake3,crc32c}] opt-level = 3` in phase 2.
# opt-level="s" de-vectorizes hashing/memcpy hot paths (2-5x cost); those crates
# must stay at 3. Cargo warns on specs that match no package, so they land with
# the dependencies.
