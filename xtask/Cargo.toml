[package]
name = "xtask"
description = "Repo automation: screenshots, binary-size checks, packaging."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

# xtask never ships, so dependency weight here is irrelevant.
[dependencies]
anyhow.workspace = true
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", features = ["json"] }
