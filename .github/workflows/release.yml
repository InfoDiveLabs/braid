name: release

# Native installers, one runner per target: there is no cross-packaging here.
# A tag builds them all; a manual run builds without publishing, which is how
# the packaging is exercised without cutting a release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      only:
        description: One platform's installers, for working on the packaging
        type: choice
        options: [all, macos, linux, windows]
        default: all

permissions:
  contents: write

jobs:
  # The matrix is built here rather than written inline so a dispatch can ask
  # for one platform. Packaging is the part of this repository that cannot be
  # tested from a developer's machine, and iterating on it should not mean
  # building five installers to look at one.
  plan:
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.pick.outputs.targets }}
    steps:
      - id: pick
        env:
          ONLY: ${{ inputs.only || 'all' }}
        run: |
          # One universal binary for macOS rather than two downloads: `lipo`
          # joins the two architectures and macOS picks at launch.
          all='[
            {"os":"macos-latest","label":"macos-universal","kind":"macos"},
            {"os":"ubuntu-latest","label":"linux-x86_64","kind":"linux"},
            {"os":"ubuntu-24.04-arm","label":"linux-aarch64","kind":"linux"},
            {"os":"windows-latest","label":"windows-x86_64","kind":"windows"},
            {"os":"windows-11-arm","label":"windows-aarch64","kind":"windows"}
          ]'
          if [ "$ONLY" = all ]; then
            targets=$(echo "$all" | jq -c .)
          else
            targets=$(echo "$all" | jq -c --arg kind "$ONLY" '[.[] | select(.kind == $kind)]')
          fi
          echo "building: $targets"
          echo "targets=$targets" >> "$GITHUB_OUTPUT"

  # Gates package and docker on the tag matching Cargo.toml, so a mistagged
  # push fails here instead of publishing a `.deb` or an image under the
  # wrong number. No tag on a dispatch run, so there is nothing to check.
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches the manifest version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(grep -m1 '^version = ' Cargo.toml | sed -E 's/version = "(.*)"/\1/')
          tag="${GITHUB_REF#refs/tags/}"
          if [ "$tag" != "v$version" ]; then
            echo "tag $tag does not match Cargo.toml version v$version" >&2
            exit 1
          fi

  package:
    needs: [plan, version]
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.targets) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Second macOS architecture
        if: matrix.kind == 'macos'
        run: rustup target add x86_64-apple-darwin aarch64-apple-darwin

      - name: Linux build dependencies
        if: matrix.kind == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libfontconfig1-dev
          cargo install cargo-deb cargo-generate-rpm

      # Building cargo-wix from source is minutes that buy nothing after the
      # first run.
      - name: Cached cargo-wix
        id: wix-cache
        if: matrix.kind == 'windows'
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-wix.exe
          key: cargo-wix-0.3.9-${{ runner.os }}-${{ runner.arch }}

      - name: Windows packaging tool
        if: matrix.kind == 'windows' && steps.wix-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-wix --version 0.3.9

      # Installed rather than assumed: the x86_64 image ships WiX 3, the ARM
      # image does not, and pinning it here means both produce an installer
      # from the same toolset instead of from whatever the image happens to
      # carry.
      - name: WiX Toolset
        if: matrix.kind == 'windows'
        shell: pwsh
        run: |
          $zip = "$env:RUNNER_TEMP\wix.zip"
          Invoke-WebRequest -Uri https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath "$env:RUNNER_TEMP\wix\bin" -Force
          # cargo-wix looks for candle.exe and light.exe under $WIX\bin.
          Add-Content -Path $env:GITHUB_ENV -Value "WIX=$env:RUNNER_TEMP\wix"

      - name: Build installer
        run: cargo run -p xtask --release -- package --out dist

      # Where the release build already happened, so the figure costs nothing
      # and names the platform it belongs to.
      - name: Binary size
        run: cargo run -p xtask --release -- size

      - uses: actions/upload-artifact@v4
        with:
          name: braid-${{ matrix.label }}
          path: |
            dist/*.dmg
            dist/*.deb
            dist/*.rpm
            dist/*.msi
          if-no-files-found: error

  # Independent of `package`, deliberately: nothing here feeds the installer
  # jobs and nothing here needs their output. A registry outage or a login
  # hiccup then costs only the image, never the installers that this release
  # has already shipped three times through. It still needs `version`, so a
  # mistagged push can't push an image before that job fails it.
  docker:
    name: container image
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Version, from the workspace manifest
        id: version
        run: |
          # The same source the installers take their version from, so a
          # `.deb` and the image built from the same commit never disagree
          # about what number they are.
          version=$(grep -m1 '^version = ' Cargo.toml | sed -E 's/version = "(.*)"/\1/')
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Registry image name, lower case
        id: image
        run: |
          # GHCR rejects an upper case path, and the repository's own casing
          # is not this workflow's to change.
          echo "name=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Moving tag, latest or beta
        id: moving
        run: |
          # A `-` marks a prerelease (e.g. 0.1.0-beta.4); that must never
          # move `:latest`, or a beta would become what `docker pull` gets
          # by default.
          version='${{ steps.version.outputs.value }}'
          if [[ "$version" == *-* ]]; then
            echo "tag=beta" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      # Skipped off a tag: a manual run only has to prove the image still
      # builds for both architectures, and logging in to push it would be a
      # credential this dry run has no use for.
      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # push is false on a manual run: buildx still builds both platforms, it
      # just has nowhere to put the result, which is what "verify without
      # publishing" means for an image the other installer jobs never see.
      - name: Build, and push only from a tag
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ startsWith(github.ref, 'refs/tags/') }}
          tags: |
            ${{ steps.image.outputs.name }}:${{ steps.version.outputs.value }}
            ${{ steps.image.outputs.name }}:${{ steps.moving.outputs.tag }}

  publish:
    needs: package
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          draft: true
          generate_release_notes: true
