[package]
name = "dl-server"
description = "A headless server that holds a download engine behind an HTTP API."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "braid-server"
path = "src/main.rs"

[dependencies]
dl-core.workspace = true
dl-net.workspace = true
dl-torrent.workspace = true

anyhow.workspace = true
axum.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "net"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
tempfile = "3"
