[package]
name = "dl-core"
description = "Download engine: scheduling, chunking, crash-safe storage, link refresh."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
devtools = []

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true

arc-swap = "1"
async-trait = "0.1"
blake3 = "1"
bytes = "1"
crc32c = "0.6"
# The whole-file digest speaks whatever the publisher published; see
# src/integrity.rs for why the per-chunk hash stays BLAKE3.
sha2 = "0.10"
md-5 = "0.10"
fs4 = "1"
futures-core = "0.3"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
tokio = { workspace = true, features = ["rt", "macros", "sync", "time", "fs", "io-util", "process"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# dl-testkit depends on dl-core; a dev-dependency cycle is permitted and keeps
# the fault-injection harness in one place.
[dev-dependencies]
dl-testkit.workspace = true
bytes = "1"
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
proptest = "1"
tempfile = "3"
